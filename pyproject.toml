[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reproq-django"
version = "0.1.531"
description = "Django 6.0 Tasks backend for reproq-worker (Postgres queue + deterministic runner)"
readme = "README.md"
authors = [{name = "Alejandro Peña", email = "adpena@gmail.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.12"
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "Django>=6.0.9,<7.0; python_version < '3.15'",
    "Django>=6.1.2,<7.0; python_version >= '3.15'",
    "croniter>=2.0.5",
    "psycopg[binary]>=3.1.0; python_version < '3.15'",
    "psycopg[binary]>=3.3.6; python_version >= '3.15'",
    # Keep Django's SQL parser on the patched public release.
    "sqlparse>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pygments>=2.20.0",
    "pytest-django>=4.9.0",
    "ruff>=0.8.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reproq_django = [
    "templates/base.html",
    "templates/admin/reproq_django/taskrun/change_list.html",
    "templates/reproq_tui/*.html",
    "resources/*.yaml",
    "resources/*.toml",
    "resources/*.sh",
]
