<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Reproq{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d6dbe6;
        --primary: #1d4ed8;
        --info: #0ea5e9;
        --success: #15803d;
        --danger: #b91c1c;
        --warning: #f59e0b;
        --dark: #111827;
        --secondary: #6b7280;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      main { padding: 24px 0 48px; }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      h1, h2, h3, h4, h5 { margin: 0 0 12px; }
      h1 { font-size: 28px; }
      h3 { font-size: 20px; }

      .h2 { font-size: 28px; font-weight: 700; }
      .h4 { font-size: 18px; font-weight: 600; }
      .h5 { font-size: 16px; font-weight: 600; }

      .mt-4 { margin-top: 24px; }
      .mt-5 { margin-top: 40px; }
      .mb-3 { margin-bottom: 16px; }
      .mb-4 { margin-bottom: 24px; }

      .d-flex { display: flex; gap: 12px; flex-wrap: wrap; }
      .justify-content-between { justify-content: space-between; }
      .align-items-center { align-items: center; }

      .row {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        margin: 0;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }

      .card-body { padding: 16px; }
      .card-title { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
      .card-text { margin: 0; }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
      }

      .btn-primary { background: var(--primary); color: #fff; }
      .btn-warning { background: var(--warning); color: #111827; }

      .text-white { color: #fff; }
      .text-dark { color: #111827; }
      .text-muted { color: var(--muted); }

      .bg-primary { background: var(--primary); }
      .bg-info { background: var(--info); }
      .bg-success { background: var(--success); }
      .bg-danger { background: var(--danger); }
      .bg-secondary { background: var(--secondary); }
      .bg-dark { background: var(--dark); }
      .bg-warning { background: var(--warning); }

      .table-responsive {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
      }

      .table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }

      .table th,
      .table td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-size: 14px;
      }

      .table thead th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .table-striped tbody tr:nth-of-type(odd) { background: #f9fafb; }
      .table-hover tbody tr:hover { background: #eef2f7; }
    </style>
  </head>
  <body>
    <main>
      {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
